<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <form [formGroup]="form" (ngSubmit)="submit()"
    class="w-full max-w-sm bg-white rounded-xl shadow-lg p-8 flex flex-col gap-4">
    <div class="text-center">
      <i class="pi pi-shop text-4xl! text-orange-500"></i>
      <h1 class="text-2xl font-bold mt-2">{{ appName }}</h1>
      <p class="text-gray-500 text-sm">Inicia sesión para continuar</p>
    </div>

    <div class="flex flex-col gap-1">
      <label for="user" class="text-sm font-medium">Usuario o correo</label>
      <input pInputText id="user" formControlName="user" autocomplete="username" />
      @if (invalid('user')) {
        <small class="text-red-600">Escribe tu usuario o correo (mínimo 3 caracteres).</small>
      }
    </div>

    <div class="flex flex-col gap-1">
      <label for="password" class="text-sm font-medium">Contraseña</label>
      <p-password inputId="password" formControlName="password" [feedback]="false"
        [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" autocomplete="current-password" />
      @if (invalid('password')) {
        <small class="text-red-600">La contraseña debe tener mínimo 6 caracteres.</small>
      }
    </div>

    @if (error()) {
      <p-message severity="error">{{ error() }}</p-message>
    }

    <p-button type="submit" label="Iniciar sesión" icon="pi pi-sign-in" [loading]="loading()" styleClass="w-full" />

    <p class="text-xs text-gray-500 text-center">
      Las cuentas las crea el administrador del sistema.
    </p>
  </form>
</div>
